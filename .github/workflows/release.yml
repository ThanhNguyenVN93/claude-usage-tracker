name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # vMAJOR.MINOR.PATCH — SemVer chính thức
      - 'v[0-9]+.[0-9]+.[0-9]+-*'  # vX.Y.Z-rc1, vX.Y.Z-beta, ...

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write   # cần để tạo Release + upload asset

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # cần để lấy tag message làm release notes

      # --- Lấy version từ tag, bỏ tiền tố "v" ---
      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"          # vX.Y.Z
          $ver = $tag.TrimStart('v')               # X.Y.Z
          echo "tag=$tag"       >> $env:GITHUB_OUTPUT
          echo "version=$ver"   >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'  # net11.0-windows — khớp TargetFramework trong .csproj

      - name: Restore & build
        working-directory: csharp
        run: dotnet restore

      # Publish self-contained single-file exe, x64 Windows
      - name: Publish
        working-directory: csharp
        run: |
          dotnet publish ClaudeUsageTracker.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version="${{ steps.ver.outputs.version }}" `
            -o publish

      - name: Rename exe + zip
        shell: pwsh
        run: |
          # Publish ra NHIEU .exe (ClaudeUsageTracker.exe + createdump.exe cua .NET).
          # Truoc day lay "Select-Object -First 1" tuc la lay theo thu tu chu cai, va so sanh
          # duong dan tuyet doi voi tuong doi nen luon khac nhau -> chay Move-Item moi lan.
          # Hien tai dung do may (Cl < cr); doi ten san pham la dong goi nham createdump.exe.
          $dest = "csharp\publish\ClaudeUsageTracker.exe"
          if (-not (Test-Path $dest)) {
            Write-Error "Khong tim thay $dest trong ban publish"
            exit 1
          }
          # Xoá pdb — không cần cho runtime
          Remove-Item "csharp\publish\*.pdb" -Force -ErrorAction SilentlyContinue
          # Tên zip phải khớp ZipRx trong UpdateService.cs: ClaudeUsageTracker-v{ver}-win-x64.zip
          $zipName = "ClaudeUsageTracker-v${{ steps.ver.outputs.version }}-win-x64.zip"
          Compress-Archive -Path "csharp\publish\*" -DestinationPath $zipName
          Write-Host "Zip: $zipName ($([Math]::Round((Get-Item $zipName).Length/1MB,1)) MB)"

      # SHA256SUMS.txt — phải khớp SumsName trong UpdateService.cs
      - name: Checksum
        shell: pwsh
        run: |
          $zipName = "ClaudeUsageTracker-v${{ steps.ver.outputs.version }}-win-x64.zip"
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -Encoding ascii "SHA256SUMS.txt"
          Write-Host "SHA256: $hash"

      # Lấy tag annotation hoặc commit message làm release notes
      - name: Build release notes
        id: notes
        shell: pwsh
        run: |
          $msg = git tag -l --format='%(contents)' "${{ steps.ver.outputs.tag }}"
          if (-not $msg) { $msg = git log -1 --pretty=format:%s }
          $msg | Out-File notes.txt -Encoding utf8
          echo "file=notes.txt" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Claude Usage Tracker ${{ steps.ver.outputs.tag }}"
          body_path: notes.txt
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          files: |
            ClaudeUsageTracker-v${{ steps.ver.outputs.version }}-win-x64.zip
            SHA256SUMS.txt
